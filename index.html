<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <title>Notif Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #000; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .card { background: #1c1c1e; border-radius: 20px; padding: 30px; width: 100%; max-width: 400px; }
    h1 { font-size: 1.5rem; margin-bottom: 10px; }
    p { color: #8e8e93; font-size: 0.9rem; margin-bottom: 25px; }
    button { background: #007aff; color: #fff; border: none; padding: 16px; font-size: 1rem; font-weight: 600; border-radius: 12px; width: 100%; cursor: pointer; }
    .status { margin-top: 20px; font-size: 0.85rem; color: #ffd60a; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h1>pwa push test</h1>
    <p>tap below to enable true background push.</p>
    <button id="btn">enable push</button>
    <div id="status" class="status"></div>
  </div>
  <script>
    const PUBLIC_KEY = 'BEKnKmx-SSdgu5xPCyFsw-7oc440LK7QeaCC6wKUd_EfEHb3lqVp7xHk2EcCY0e23xaZY_JvpclT1HZzkJz7Oy0';

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(console.error);
    }

    const btn = document.getElementById('btn');
    const status = document.getElementById('status');

    btn.addEventListener('click', async () => {
      const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
      if (!isStandalone) {
        status.textContent = 'add to home screen first gng';
        return;
      }

      const perm = await Notification.requestPermission();
      if (perm !== 'granted') {
        status.textContent = 'permission denied';
        return;
      }

      try {
        const reg = await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();
        if (!sub) {
          sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(PUBLIC_KEY)
          });
        }

        // send sub json to your worker backend
        console.log(JSON.stringify(sub));
        status.textContent = 'subscribed successfully!';
      } catch (err) {
        status.textContent = 'err: ' + err.message;
      }
    });

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
    }
  </script>
</body>
</html>
