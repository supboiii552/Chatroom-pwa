<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>Notif Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #000; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .card { background: #1c1c1e; border-radius: 20px; padding: 30px; width: 100%; max-width: 400px; }
    h1 { font-size: 1.5rem; margin-bottom: 10px; }
    p { color: #8e8e93; font-size: 0.9rem; margin-bottom: 25px; }
    button { background: #007aff; color: #fff; border: none; padding: 16px; font-size: 1rem; font-weight: 600; border-radius: 12px; width: 100%; cursor: pointer; }
    button:disabled { background: #3a3a3c; color: #8e8e93; }
    .status { margin-top: 20px; font-size: 0.85rem; color: #ffd60a; }
  </style>
</head>
<body>
  <div class="card">
    <h1>pwa test</h1>
    <p>tap test, then go to your ipad home screen within 5 seconds.</p>
    <button id="btn">send in 5s</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    }

    const btn = document.getElementById('btn');
    const status = document.getElementById('status');

    btn.addEventListener('click', async () => {
      if (!('Notification' in window)) {
        status.textContent = 'not supported';
        return;
      }

      let perm = Notification.permission;
      if (perm === 'default') perm = await Notification.requestPermission();

      if (perm !== 'granted') {
        status.textContent = 'denied';
        return;
      }

      btn.disabled = true;
      status.textContent = 'locking phone in 5s... go to home screen!';

      setTimeout(async () => {
        try {
          const reg = await navigator.serviceWorker.ready;
          await reg.showNotification('pwa notification', {
            body: 'it finally came through'
          });
          status.textContent = 'sent';
        } catch (err) {
          new Notification('pwa notification', { body: 'fallback sent' });
          status.textContent = 'sent (fallback)';
        }
        btn.disabled = false;
      }, 5000);
    });
  </script>
</body>
</html>
